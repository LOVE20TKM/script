<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>市值曲线看板</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #16202a;
      --muted: #667085;
      --line: #e5e7eb;
      --accent: #1d5b89;
      --shadow: 0 18px 54px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      padding: 22px 16px 52px;
    }
    .shell { width: 100%; max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
    .hero, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .hero { padding: 24px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.05; }
    .hero p { margin: 10px 0 0; color: var(--muted); line-height: 1.7; }
    .meta { min-width: 260px; display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    .panel { padding: 18px; }
    .controls { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field-label { font-size: 12px; color: var(--muted); }
    select, input, button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }
    button { cursor: pointer; font-weight: 700; }
    #refreshButton { border-color: var(--accent); background: var(--accent); color: #fff; }
    .metric-toggle { display: flex; min-width: 0; }
    .metric-toggle button { flex: 1 1 0; border-radius: 0; white-space: nowrap; }
    .metric-toggle button:first-child { border-radius: 9px 0 0 9px; }
    .metric-toggle button:last-child { border-radius: 0 9px 9px 0; }
    .metric-toggle button + button { margin-left: -1px; }
    .metric-toggle button.active { position: relative; z-index: 1; border-color: var(--accent); background: var(--accent); color: #fff; }
    .status { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .series { display: grid; gap: 14px; }
    .chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .title { font-weight: 800; font-size: 18px; }
    .subtle { color: var(--muted); font-size: 13px; }
    .chart-wrap { min-width: 0; overflow: hidden; }
    svg { display: block; width: 100%; height: auto; aspect-ratio: 900 / 320; }
    .guide-hit { cursor: crosshair; }
    .guide-line { stroke: #364152; stroke-width: 1; stroke-dasharray: 4 4; opacity: .72; }
    .empty { min-height: 180px; display: grid; place-items: center; color: var(--muted); }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; margin: 0 0 12px; }
    .legend-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      max-width: 100%;
      padding: 7px 9px;
      border-color: var(--line);
      background: #fff;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .legend-button.active { border-color: var(--accent); }
    .legend-button:disabled { cursor: not-allowed; opacity: .58; }
    .legend-swatch { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; }
    .legend-label { min-width: 0; }
    .legend-value { color: var(--muted); font-size: 12px; font-weight: 400; }
    @media (max-width: 860px) {
      .controls { grid-template-columns: 1fr; }
      .metric-toggle { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">LOVE20 Dashboards</p>
        <h1>市值曲线看板</h1>
        <p>从本地 events.db 的 PairCreated、Sync、TokenMint 和 TokenBurn 事件生成市值与价格曲线，默认以 TUSDT 计价。</p>
      </div>
      <div class="meta">
        <div>网络：<span id="networkValue">-</span></div>
        <div>DB 更新时间：<span id="dbMtimeValue">-</span></div>
        <div>数据窗口：<span id="windowValue">-</span></div>
      </div>
    </section>

    <section class="panel">
      <div class="controls">
        <label class="field">
          <span class="field-label">计价代币</span>
          <select id="quoteSelect"></select>
        </label>
        <label class="field">
          <span class="field-label">时间范围</span>
          <input id="daysInput" type="number" min="1" max="180" step="1" value="30" />
        </label>
        <label class="field">
          <span class="field-label">聚合周期</span>
          <select id="intervalSelect">
            <option value="1h">1小时</option>
            <option value="4h">4小时</option>
            <option value="1d" selected>1天</option>
          </select>
        </label>
        <div class="field">
          <span class="field-label">指标</span>
          <div class="metric-toggle" id="metricToggle" role="group" aria-label="曲线指标">
            <button type="button" data-metric="market_cap" class="active">市值</button>
            <button type="button" data-metric="close">币价</button>
          </div>
        </div>
        <button id="refreshButton" type="button">查询</button>
      </div>
      <div class="status" id="statusValue"></div>
    </section>

    <section class="series" id="seriesRoot"></section>
  </div>

  <script>
    const API_URL = "/api/dashboards/market-curve";
    const COLORS = ["#1d5b89", "#c46b2d", "#2d7d62", "#b2395b", "#6d4c91", "#7a6b2c", "#3e6fa3", "#9a4f8a"];
    const METRICS = {
      market_cap: { label: "市值", title: "市值曲线" },
      close: { label: "币价", title: "币价曲线" },
    };
    const params = new URLSearchParams(window.location.search);
    const state = {
      network: params.get("network") || "thinkium70001_public",
      quote: params.get("quote") || "TUSDT",
      days: params.get("days") || "30",
      interval: params.get("interval") || "1d",
      metric: "market_cap",
      series: [],
      payload: null,
    };
    let visibleTokens = new Set();

    const quoteSelect = document.getElementById("quoteSelect");
    const daysInput = document.getElementById("daysInput");
    const intervalSelect = document.getElementById("intervalSelect");
    const metricToggle = document.getElementById("metricToggle");
    const refreshButton = document.getElementById("refreshButton");
    const statusValue = document.getElementById("statusValue");
    const seriesRoot = document.getElementById("seriesRoot");
    const networkValue = document.getElementById("networkValue");
    const dbMtimeValue = document.getElementById("dbMtimeValue");
    const windowValue = document.getElementById("windowValue");

    function formatMetric(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) return "-";
      if (number >= 1000) return number.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
      if (number >= 1) return number.toLocaleString("zh-CN", { maximumFractionDigits: 4 });
      return number.toLocaleString("zh-CN", { maximumSignificantDigits: 4 });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function syncUrl() {
      const next = new URLSearchParams();
      next.set("network", state.network);
      next.set("quote", state.quote);
      next.set("days", state.days);
      next.set("interval", state.interval);
      history.replaceState(null, "", `${location.pathname}?${next.toString()}`);
    }

    async function fetchData(metaOnly = false) {
      statusValue.textContent = metaOnly ? "加载参数中..." : "查询中...";
      refreshButton.disabled = true;
      const api = new URL(API_URL, location.origin);
      api.searchParams.set("network", state.network);
      api.searchParams.set("quote", state.quote);
      api.searchParams.set("days", state.days);
      api.searchParams.set("interval", state.interval);
      if (metaOnly) api.searchParams.set("meta", "1");

      try {
        const response = await fetch(api.toString(), { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "读取失败");
        state.payload = payload;
        render(payload, metaOnly);
        if (metaOnly) {
          await fetchData();
        } else {
          statusValue.textContent = "已更新";
        }
      } catch (error) {
        statusValue.textContent = error.message || "读取失败";
      } finally {
        refreshButton.disabled = false;
      }
    }

    function render(payload, metaOnly = false) {
      const data = payload.data || {};
      networkValue.textContent = payload.network || "-";
      dbMtimeValue.textContent = payload.db_mtime || "-";
      windowValue.textContent = metaOnly ? "加载中" : `${data.from_time || "-"} ~ ${data.to_time || "-"}`;
      renderQuoteSelect(data.tokens || []);
      if (metaOnly) {
        syncUrl();
        return;
      }

      state.series = Array.isArray(data.series) ? data.series : [];
      state.quote = data.quote?.symbol || state.quote;
      syncUrl();
      renderCombinedChart(state.series, data.quote || { symbol: state.quote }, true);
    }

    function renderQuoteSelect(tokens) {
      quoteSelect.innerHTML = tokens.map((token) => {
        const symbol = String(token.symbol ?? "");
        return `<option value="${escapeHtml(symbol)}" ${symbol === state.quote ? "selected" : ""}>${escapeHtml(symbol)}</option>`;
      }).join("");
      if (tokens.some((token) => token.symbol === state.quote)) return;
      if (tokens[0]?.symbol) {
        state.quote = tokens[0].symbol;
        quoteSelect.value = state.quote;
      }
    }

    function tokenKey(item) {
      return String(item?.token?.symbol || item?.token?.address || "");
    }

    function isDrawable(item) {
      return !item?.message && Array.isArray(item?.candles) && item.candles.length > 0;
    }

    function latestMetric(item) {
      if (!Array.isArray(item?.candles)) return null;
      return [...item.candles].reverse().find((candle) => {
        const value = Number(candle[state.metric]);
        return Number.isFinite(value) && value >= 0;
      });
    }

    function renderCombinedChart(series, quote, resetVisibility = false) {
      const items = Array.isArray(series) ? series : [];
      const quoteSymbol = String(quote?.symbol || state.quote || "");
      const metric = METRICS[state.metric];
      if (resetVisibility) {
        visibleTokens = new Set(items.filter(isDrawable).map(tokenKey));
      }

      const legend = items.map((item, index) => {
        const key = tokenKey(item);
        const drawable = isDrawable(item);
        const latest = latestMetric(item);
        const message = item.message || (drawable ? "" : "暂无可绘制数据");
        const valueText = latest ? `${formatMetric(latest[state.metric])} ${quoteSymbol}` : message;
        return `<button type="button" class="legend-button ${visibleTokens.has(key) ? "active" : ""}" data-token="${escapeHtml(key)}" ${drawable ? "" : "disabled"} title="${escapeHtml(message || key)}">
          <span class="legend-swatch" data-token="${escapeHtml(key)}" style="background:${COLORS[index % COLORS.length]}"></span>
          <span class="legend-label">${escapeHtml(key)} <span class="legend-value">${escapeHtml(valueText)}</span></span>
        </button>`;
      }).join("");
      const visibleItems = items.filter((item) => isDrawable(item) && visibleTokens.has(tokenKey(item)));
      const chart = visibleItems.length
        ? combinedChartSvg(visibleItems, quoteSymbol, metric)
        : `<div class="empty">${items.length ? "请选择至少一个图例" : "暂无可展示数据"}</div>`;

      seriesRoot.innerHTML = `<section class="panel">
        <div class="chart-head">
          <div>
            <div class="title">${escapeHtml(metric.title)} · ${escapeHtml(quoteSymbol)}</div>
            <div class="subtle">横轴：时间　纵轴：${escapeHtml(metric.label)}（${escapeHtml(quoteSymbol)}）</div>
          </div>
          <div class="subtle">图例中的最新值随指标切换更新</div>
        </div>
        <div class="chart-legend" id="chartLegend">${legend}</div>
        <div class="chart-wrap">${chart}</div>
      </section>`;
      wireChartGuides();
    }

    function combinedChartSvg(items, quoteSymbol, metric) {
      const width = 900;
      const height = 320;
      const margin = { top: 24, right: 92, bottom: 34, left: 16 };
      const chartWidth = width - margin.left - margin.right;
      const chartHeight = height - margin.top - margin.bottom;
      const valueKey = state.metric;
      const times = [...new Set(items.flatMap((item) => item.candles.map((candle) => Number(candle.time))).filter((time) => Number.isFinite(time)))].sort((a, b) => a - b);
      const values = items.flatMap((item) => item.candles.map((candle) => Number(candle[valueKey]))).filter((value) => Number.isFinite(value) && value >= 0);
      if (!times.length || !values.length) return `<div class="empty">${escapeHtml(metric.label)}暂无数据</div>`;

      const maxValue = Math.max(...values);
      const minValue = Math.min(...values);
      const pad = maxValue === minValue ? (maxValue * 0.05 || 1) : 0;
      const top = maxValue + pad;
      const bottom = Math.max(0, minValue - pad);
      const range = top - bottom || 1;
      const x = (time) => margin.left + (times.length > 1 ? (times.indexOf(time) / (times.length - 1)) * chartWidth : chartWidth / 2);
      const y = (value) => margin.top + ((top - value) / range) * chartHeight;
      const dateText = (time) => new Date(time * 1000).toLocaleDateString("zh-CN");
      const grid = [top, (top + bottom) / 2, bottom].map((value) => {
        const yy = y(value);
        return `<g><line x1="${margin.left}" y1="${yy}" x2="${width - margin.right}" y2="${yy}" stroke="#edf0f3"/><text x="${width - margin.right + 8}" y="${yy + 4}" fill="#667085" font-size="11">${formatMetric(value)}</text></g>`;
      }).join("");
      const guidePoints = [];
      const layers = items.map((item, index) => {
        const key = tokenKey(item);
        const colorIndex = state.series.indexOf(item);
        const color = COLORS[(colorIndex < 0 ? index : colorIndex) % COLORS.length];
        const points = item.candles.map((candle) => {
          const value = Number(candle[valueKey]);
          if (!Number.isFinite(value) || value < 0 || !Number.isFinite(Number(candle.time))) return null;
          const point = { x: x(Number(candle.time)), y: y(value) };
          guidePoints.push({ token: key, time: dateText(Number(candle.time)), value, x: point.x, y: point.y });
          return `${point.x},${point.y}`;
        }).filter(Boolean).join(" ");
        return `<g class="series-layer" data-token="${escapeHtml(key)}"><polyline class="series-line" points="${points}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></g>`;
      }).join("");
      const guidePayload = escapeHtml(encodeURIComponent(JSON.stringify(guidePoints)));

      return `<svg class="line-chart" data-guide-points="${guidePayload}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(metric.title)}曲线图">
        <text x="${margin.left}" y="14" fill="#16202a" font-size="13" font-weight="700">${escapeHtml(metric.label)}（${escapeHtml(quoteSymbol)}）</text>
        <line x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}" stroke="#e5e7eb"/>
        <line x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}" stroke="#e5e7eb"/>
        ${grid}${layers}
        <text x="${margin.left}" y="${height - 9}" fill="#667085" font-size="11">${dateText(times[0])}</text>
        <text x="${width - margin.right - 90}" y="${height - 9}" fill="#667085" font-size="11">${dateText(times[times.length - 1])}</text>
        <g class="guide" opacity="0" pointer-events="none">
          <line class="guide-v guide-line" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"/>
          <line class="guide-h guide-line" x1="${margin.left}" y1="${margin.top}" x2="${width - margin.right}" y2="${margin.top}"/>
          <circle class="guide-dot" cx="${margin.left}" cy="${margin.top}" r="4" fill="#fff" stroke="#364152" stroke-width="2"/>
          <rect class="guide-x-bg" rx="4" fill="#16202a" opacity=".9"/>
          <text class="guide-x-text" y="${height - 9}" fill="#fff" font-size="11" text-anchor="middle"></text>
          <rect class="guide-y-bg" rx="4" fill="#16202a" opacity=".9"/>
          <text class="guide-y-text" x="${width - margin.right - 6}" fill="#fff" font-size="11" text-anchor="end"></text>
        </g>
        <rect class="guide-hit" x="${margin.left}" y="${margin.top}" width="${chartWidth}" height="${chartHeight}" fill="transparent" pointer-events="all"/>
      </svg>`;
    }

    function wireChartGuides() {
      document.querySelectorAll(".line-chart").forEach((svg) => {
        const guide = svg.querySelector(".guide");
        const guideV = svg.querySelector(".guide-v");
        const guideH = svg.querySelector(".guide-h");
        const hit = svg.querySelector(".guide-hit");
        const guideDot = svg.querySelector(".guide-dot");
        const xText = svg.querySelector(".guide-x-text");
        const xBg = svg.querySelector(".guide-x-bg");
        const yText = svg.querySelector(".guide-y-text");
        const yBg = svg.querySelector(".guide-y-bg");
        if (!guide || !guideV || !guideH || !hit) return;
        const points = JSON.parse(decodeURIComponent(svg.dataset.guidePoints || "[]"));
        const chartLeft = Number(hit.getAttribute("x"));
        const chartRight = chartLeft + Number(hit.getAttribute("width"));
        const chartTop = Number(hit.getAttribute("y"));
        const chartBottom = chartTop + Number(hit.getAttribute("height"));

        hit.addEventListener("pointermove", (event) => {
          const point = svg.createSVGPoint();
          point.x = event.clientX;
          point.y = event.clientY;
          const cursor = point.matrixTransform(svg.getScreenCTM().inverse());
          const nearest = points.reduce((best, item) => (
            Math.abs(item.x - cursor.x) < Math.abs(best.x - cursor.x) ? item : best
          ), points[0]);
          if (!nearest) return;

          guide.setAttribute("opacity", "1");
          guideV.setAttribute("x1", nearest.x);
          guideV.setAttribute("x2", nearest.x);
          guideH.setAttribute("y1", nearest.y);
          guideH.setAttribute("y2", nearest.y);
          guideDot?.setAttribute("cx", nearest.x);
          guideDot?.setAttribute("cy", nearest.y);

          if (xText && xBg) {
            xText.textContent = nearest.time;
            xText.setAttribute("x", Math.min(Math.max(nearest.x, chartLeft + 44), chartRight - 44));
            fitSvgLabel(xText, xBg);
          }
          if (yText && yBg) {
            yText.textContent = `${nearest.token} · ${nearest.time} · ${formatMetric(nearest.value)} ${state.quote}`;
            yText.setAttribute("y", Math.min(Math.max(nearest.y + 4, chartTop + 12), chartBottom - 4));
            fitSvgLabel(yText, yBg);
          }
        });
        hit.addEventListener("pointerleave", () => guide.setAttribute("opacity", "0"));
      });
    }

    function fitSvgLabel(text, background) {
      const box = text.getBBox();
      background.setAttribute("x", box.x - 5);
      background.setAttribute("y", box.y - 3);
      background.setAttribute("width", box.width + 10);
      background.setAttribute("height", box.height + 6);
    }

    metricToggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-metric]");
      if (!button || !METRICS[button.dataset.metric]) return;
      state.metric = button.dataset.metric;
      metricToggle.querySelectorAll("button[data-metric]").forEach((item) => item.classList.toggle("active", item === button));
      if (state.payload) renderCombinedChart(state.series, state.payload.data?.quote || { symbol: state.quote });
    });

    document.getElementById("seriesRoot").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-token]");
      if (!button || button.disabled) return;
      const token = button.dataset.token;
      if (visibleTokens.has(token)) visibleTokens.delete(token);
      else visibleTokens.add(token);
      renderCombinedChart(state.series, state.payload.data?.quote || { symbol: state.quote });
    });

    refreshButton.addEventListener("click", () => {
      state.quote = quoteSelect.value;
      state.days = daysInput.value || "30";
      state.interval = intervalSelect.value;
      fetchData();
    });
    quoteSelect.addEventListener("change", () => { state.quote = quoteSelect.value; });
    daysInput.value = state.days;
    intervalSelect.value = state.interval;
    fetchData(true);
  </script>
</body>
</html>
